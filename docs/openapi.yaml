openapi: 3.0.3
info:
  title: Pizza Fruzta Customer API
  version: 1.0.0
  description: |
    Kontrak REST customer Pizza Fruzta (`/api/v1`). Katalog dan checkout tamu
    bersifat publik; endpoint `/me*` dan `/auth/logout` memakai bearer token.
    Server selalu otoritatif untuk harga, ongkir, total, pembayaran, dan stok.
    Dokumen naratif ada di `docs/api.md`.
servers:
  - url: https://<domain>/api/v1
    description: Produksi
  - url: http://127.0.0.1:8000/api/v1
    description: Development
tags:
  - name: Katalog
  - name: Checkout
  - name: Akun
  - name: Profil
  - name: Alamat
  - name: Device
  - name: Webhook
security:
  - bearerAuth: []
paths:
  /branches:
    get:
      tags: [Katalog]
      summary: Daftar cabang aktif
      security: []
      responses:
        '200':
          description: Daftar cabang, diurutkan nama.
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: {$ref: '#/components/schemas/Branch'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /products:
    get:
      tags: [Katalog]
      summary: Katalog produk satu cabang
      security: []
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produk aktif dan tersedia di cabang.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /delivery/areas:
    get:
      tags: [Katalog]
      summary: Cari area pengiriman Biteship
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: Hasil pencarian area.
          content:
            application/json:
              schema:
                type: object
                required: [areas]
                properties:
                  areas:
                    type: array
                    items: {$ref: '#/components/schemas/DeliveryArea'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/ProviderUnavailable'}
  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Perkiraan ongkir dan opsi kurir
      description: Auth opsional. Tanpa bearer berjalan sebagai guest.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
      responses:
        '200':
          description: Opsi kurir dari server.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/ProviderUnavailable'}
  /orders:
    post:
      tags: [Checkout]
      summary: Buat order customer dan invoice DOKU
      description: |
        Auth opsional. Guest mengirim `customer_name`/`customer_phone`; bearer
        valid membuat server memakai profil dan menghubungkan order ke akun.
        Header `Idempotency-Key` wajib.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 100}
          description: Unik per checkout; replay key yang sama mengembalikan order yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Order baru dibuat.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateOrderResponse'}
        '200':
          description: Replay idempotensi; order yang sama dikembalikan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateOrderResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Idempotency-Key sudah dipakai pemilik lain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502':
          description: Provider pembayaran/pengiriman tidak tersedia.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
                  token: {type: string, format: uuid, nullable: true}
  /orders/{token}:
    get:
      tags: [Checkout]
      summary: Detail status order via public token
      security: []
      parameters:
        - $ref: '#/components/parameters/OrderToken'
      responses:
        '200':
          description: Detail order customer-safe.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/register:
    post:
      tags: [Akun]
      summary: Daftar akun customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Akun dibuat dan token diterbitkan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login:
    post:
      tags: [Akun]
      summary: Login customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Login berhasil dan token baru diterbitkan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/forgot-password:
    post:
      tags: [Akun]
      summary: Kirim OTP reset password ke email
      description: Selalu 202 generik, baik email terdaftar maupun tidak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202':
          description: Permintaan diterima.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/reset-password:
    post:
      tags: [Akun]
      summary: Reset password dengan OTP email
      description: Sukses mengganti password dan mencabut semua token bearer customer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200':
          description: Password berhasil diubah.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      tags: [Akun]
      summary: Cabut token yang sedang dipakai
      responses:
        '204': {description: Token dicabut.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me:
    get:
      tags: [Profil]
      summary: Profil customer
      responses:
        '200':
          description: Profil beserta jumlah alamat.
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer: {$ref: '#/components/schemas/CustomerWithCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Profil]
      summary: Ubah nama profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 255}
      responses:
        '200':
          description: Profil setelah diubah.
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer: {$ref: '#/components/schemas/CustomerWithCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/orders:
    get:
      tags: [Profil]
      summary: Riwayat order customer (10 per halaman)
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Riwayat order terbaru lebih dulu.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderHistoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/addresses:
    get:
      tags: [Alamat]
      summary: Daftar alamat tersimpan
      responses:
        '200':
          description: Default lebih dulu, lalu terlama.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Alamat]
      summary: Tambah alamat tersimpan (maks 10)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreAddressRequest'}
      responses:
        '201':
          description: Alamat dibuat.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/addresses/{address}:
    patch:
      tags: [Alamat]
      summary: Ubah alamat tersimpan (semantik PATCH)
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAddressRequest'}
      responses:
        '200':
          description: Alamat setelah diubah.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Alamat]
      summary: Hapus alamat tersimpan
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204': {description: Alamat dihapus.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/devices:
    post:
      tags: [Device]
      summary: Daftarkan atau refresh token FCM
      description: Idempoten per token; token yang sama dipindahkan ke akun yang sedang login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterDeviceRequest'}
      responses:
        '200':
          description: Device tersimpan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /me/devices/{device}:
    delete:
      tags: [Device]
      summary: Hapus device FCM
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': {description: Device dihapus.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /webhooks/doku:
    post:
      tags: [Webhook]
      summary: Notifikasi pembayaran DOKU (internal)
      description: Jangan dipanggil frontend. Verifikasi signature DOKU adalah gerbangnya.
      security: []
      parameters:
        - name: Signature
          in: header
          required: true
          schema: {type: string}
        - name: Client-Id
          in: header
          required: true
          schema: {type: string}
        - name: Request-Id
          in: header
          required: true
          schema: {type: string}
        - name: Request-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: Request-Target
          in: header
          required: true
          schema: {type: string}
        - name: Digest
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DokuWebhookRequest'}
      responses:
        '200':
          description: Notifikasi diterima atau diabaikan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '403':
          description: Signature tidak valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {description: Error internal; DOKU akan retry.}
  /webhooks/biteship:
    post:
      tags: [Webhook]
      summary: Update pengiriman Biteship (internal)
      description: Jangan dipanggil frontend. Nama header dan isinya diatur env BITESHIP_WEBHOOK_KEY/SECRET.
      security: []
      parameters:
        - name: X-Biteship-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BiteshipWebhookRequest'}
      responses:
        '200':
          description: Event diterima; idempotent bila diulang.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '403':
          description: Header signature tidak valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaque 40 karakter dari register/login, berlaku 30 hari.
  parameters:
    OrderToken:
      name: token
      in: path
      required: true
      schema: {type: string, format: uuid}
    AddressId:
      name: address
      in: path
      required: true
      schema: {type: integer}
    DeviceId:
      name: device
      in: path
      required: true
      schema: {type: integer}
  responses:
    Unauthorized:
      description: Token hilang, tidak valid, kedaluwarsa, atau akun nonaktif.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Validasi atau aturan bisnis gagal.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ProviderUnavailable:
      description: Provider upstream (Biteship/DOKU) tidak tersedia.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
    ValidationError:
      type: object
      required: [message]
      properties:
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Branch:
      type: object
      required: [id, code, name, address, phone, opens_at, closes_at, is_open, supports_delivery]
      properties:
        id: {type: integer}
        code: {type: string}
        name: {type: string}
        address: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        opens_at: {type: string, example: '10:00'}
        closes_at: {type: string, example: '22:00'}
        is_open: {type: boolean}
        supports_delivery: {type: boolean}
    Product:
      type: object
      required: [id, name, description, category, base_price, weight_grams, image_url, variants, modifier_groups]
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        category:
          type: object
          nullable: true
          properties:
            id: {type: integer}
            name: {type: string}
        base_price: {type: integer, description: IDR}
        weight_grams: {type: integer, nullable: true}
        image_url: {type: string, nullable: true}
        variants:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              price: {type: integer}
        modifier_groups:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              modifiers:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    name: {type: string}
                    price_delta: {type: integer}
    DeliveryArea:
      type: object
      properties:
        id: {type: string, nullable: true}
        name: {type: string, nullable: true}
        city: {type: string, nullable: true}
        province: {type: string, nullable: true}
        postal_code: {type: string, nullable: true}
      additionalProperties: true
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: {type: integer}
        variant_id: {type: integer, nullable: true}
        modifier_ids:
          type: array
          items: {type: integer}
        quantity: {type: integer, minimum: 1, maximum: 99}
        note: {type: string, maxLength: 255, nullable: true}
    QuoteRequest:
      type: object
      required: [branch_id, fulfillment, items]
      properties:
        branch_id: {type: integer}
        fulfillment: {type: string, enum: [pickup, delivery]}
        destination_area_id: {type: string, maxLength: 64, nullable: true}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/OrderItemInput'}
    QuoteOption:
      type: object
      required: [courier_name, courier_service, fee, etd]
      properties:
        courier_name: {type: string}
        courier_service: {type: string}
        fee: {type: integer, description: IDR}
        etd: {type: string, nullable: true}
    QuoteResponse:
      type: object
      required: [options]
      properties:
        options:
          type: array
          items: {$ref: '#/components/schemas/QuoteOption'}
    CreateOrderRequest:
      allOf:
        - $ref: '#/components/schemas/QuoteRequest'
        - type: object
          properties:
            customer_name: {type: string, maxLength: 255}
            customer_phone: {type: string, example: '081234567890'}
            note: {type: string, maxLength: 500, nullable: true}
            delivery_address: {type: string, maxLength: 500, nullable: true}
            courier_name: {type: string, maxLength: 100, nullable: true}
            courier_service: {type: string, maxLength: 100, nullable: true}
    OrderItem:
      type: object
      properties:
        product_name: {type: string}
        variant_name: {type: string, nullable: true}
        quantity: {type: integer}
        unit_price: {type: integer}
        line_total: {type: integer}
        note: {type: string, nullable: true}
        modifiers:
          type: array
          items:
            type: object
            properties:
              modifier_name: {type: string}
              price_delta: {type: integer}
    OrderStatus:
      type: string
      enum: [queued, accepted, preparing, ready, completed, cancelled]
    PaymentStatus:
      type: string
      enum: [unpaid, pending, paid, voided]
    Order:
      type: object
      properties:
        order_number: {type: string}
        branch_id: {type: integer}
        token: {type: string, format: uuid, nullable: true}
        channel: {type: string, enum: [takeaway, delivery]}
        status: {$ref: '#/components/schemas/OrderStatus'}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        subtotal: {type: integer}
        delivery_fee: {type: integer}
        total: {type: integer}
        customer_name: {type: string, nullable: true}
        customer_phone: {type: string, nullable: true}
        note: {type: string, nullable: true}
        delivery_address: {type: string, nullable: true}
        courier_name: {type: string, nullable: true}
        courier_service: {type: string, nullable: true}
        delivery_status: {type: string, nullable: true}
        tracking_url: {type: string, nullable: true}
        created_at: {type: string, format: date-time, nullable: true}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
    CreateOrderResponse:
      type: object
      required: [order, token]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        token: {type: string, format: uuid}
        payment_url: {type: string, nullable: true}
        payment_expires_at: {type: string, format: date-time, nullable: true}
    OrderDetailResponse:
      type: object
      required: [order]
      properties:
        order: {$ref: '#/components/schemas/Order'}
    OrderSummary:
      type: object
      properties:
        order_number: {type: string}
        token: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time, nullable: true}
        channel: {type: string, enum: [takeaway, delivery]}
        status: {$ref: '#/components/schemas/OrderStatus'}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        delivery_status: {type: string, nullable: true}
        total: {type: integer}
    PaginationMeta:
      type: object
      properties:
        current_page: {type: integer}
        last_page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
    OrderHistoryResponse:
      type: object
      required: [orders, meta]
      properties:
        orders:
          type: array
          items: {$ref: '#/components/schemas/OrderSummary'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Customer:
      type: object
      required: [id, name, phone, email, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        phone: {type: string}
        email: {type: string, format: email, nullable: true}
        created_at: {type: string, format: date-time, nullable: true}
    CustomerWithCount:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            addresses_count: {type: integer}
    AuthResponse:
      type: object
      required: [customer, token, expires_at]
      properties:
        customer: {$ref: '#/components/schemas/Customer'}
        token: {type: string, description: Token opaque 40 karakter; hanya muncul sekali.}
        expires_at: {type: string, format: date-time}
    RegisterRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name: {type: string, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
